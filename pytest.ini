[pytest]
# Only this project's tests. `repositories/` holds vendored third-party repos
# (e.g. SAE_BoardGameEval) checked out for reference; their test modules import
# packages we do not install (circuits, pandas), and a bare `pytest` aborts the
# ENTIRE run on those collection errors -- so the project's own 147 tests never
# execute. Scoping collection here keeps `pytest` with no arguments meaningful.
testpaths = tests
norecursedirs = repositories .venv .git __pycache__ legacy_mode2x2_false
