# I03-champYb: anchored-jumprelu, t=64, exp=8, λ_high=0.3, λ_medium=0.1.
# Anchors first 36 dictionary slots to tigerYb BSPs via BCE-with-logits on the
# encoder pre-activation. High-tier categories (3): ['tiger_square_winnable', 'tiger_offered_completing_attr', 'tiger_line_winnable'].
# Built on F04 jumprelu (champYb fc1 winner) as the base architecture; the
# I-series sweeps λ_high ∈ {0.03, 0.10, 0.30, 1.0} × 3 seeds.
experiment: I03-champYb-lh030-s44
architecture: anchored-jumprelu
game: quarto
hook: s4.fc1
data: data/quarto/s4.fc1_amalgam_yb_activations.pt
expansion: 8
batch_size: 4096
num_batches: 25000
lr: 0.0003
seed: 44
log_every: 500
jump_threshold: 0.001
l0_target: 64
patience: 0
min_improvement: 0.001
l0_patience: 0
l0_min_change: 5.0
# Anchor configuration
anchor_bsps: data/quarto/bsp_labels-tigerYb_36.pt
anchor_schema: data/quarto/bsp_schema-tiger_36.json
anchor_index_mode: prefix
anchor_loss: bce
anchor_lambda_high: 0.3
anchor_lambda_medium: 0.1
anchor_high_categories:
  - tiger_square_winnable
  - tiger_offered_completing_attr
  - tiger_line_winnable

# --- Recipe conformance stamp (added 2026-08-15) ---
# This run was trained BEFORE the canonical-form fix, so its deviations are
# pinned explicitly here. Defaults are now the published form; without these
# lines a rerun would train a different (canonical) SAE under the same name.
# See docs/diary/2026-08-15_dead-feature-revival.md
init_mode: kaiming            # legacy: W_enc drawn independently
