# E07-champYb: conv2 jumprelu t=32 exp=8 with the patience fix.
# Original C07-champS4 stopped after 7 log steps because patience=20 +
# min_improvement=0.02 triggered on the jumprelu theta warm-up plateau.
# This rerun drops min_improvement to 0.005 so the FVU curve has room
# to descend.
experiment: E07-champYb-s42
architecture: jumprelu
game: quarto
hook: s4.conv2
data: data/quarto/s4.conv2_amalgam_yb_activations.pt
expansion: 8
batch_size: 4096
num_batches: 25000
lr: 0.0003
seed: 42
log_every: 500
jump_threshold: 0.001
l0_target: 32
patience: 20
min_improvement: 0.005
l0_patience: 5
l0_min_change: 5.0

# --- Recipe conformance stamp (added 2026-08-15) ---
# This run was trained BEFORE the canonical-form fix, so its deviations are
# pinned explicitly here. Defaults are now the published form; without these
# lines a rerun would train a different (canonical) SAE under the same name.
# See docs/diary/2026-08-15_dead-feature-revival.md
init_mode: kaiming            # legacy: W_enc drawn independently
