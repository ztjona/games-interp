# Arnold Beta: TopK k=128 (geometry test — 12.5% active vs 3.1% at k=32)
#
# Hypothesis: high dead-feature% in k=32/64 is a geometry mismatch.
# Natural L0 for fc1 is ~400/1024 (39%). k=32 forces 3.1% active,
# creating brutal competition — most features never enter top-32 and
# the aux loss (sampling k=32 dead features/batch) is too slow to revive them.
# k=128 (12.5% active) tests whether matching the natural L0 ratio
# brings dead% down to acceptable levels (<40%).
experiment: arnold_beta
architecture: topk
game: quarto
hook: fc1
data: data/quarto/fc1_amalgam_activations.pt

expansion: 8
batch_size: 4096
num_batches: 5000
lr: 3e-4
seed: 42
log_every: 100

k: 128
label: "topk k=128 (geometry test)"
