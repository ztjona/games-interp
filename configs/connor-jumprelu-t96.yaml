# Connor: JumpReLU l0_target=96
# Rationale: Fills the gap between t64 (best board_recon=0.8255) and t128 (untested).
# Hypothesis: L0≈96 may achieve even higher board reconstruction than t64.
experiment: connor
architecture: jumprelu
game: quarto
hook: fc1
data: data/quarto/fc1_amalgam_activations.pt

expansion: 8
batch_size: 4096
num_batches: 5000
lr: 3e-4
seed: 42
log_every: 100

jump_threshold: 0.001
l0_target: 96
label: "jumprelu t=96"
