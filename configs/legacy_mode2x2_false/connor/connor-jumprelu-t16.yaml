# Connor: JumpReLU l0_target=16 (push sparser than best t32)
# Hypothesis: tighter sparsity forces more dedicated per-BSP features,
# improving coverage_above_75 (currently only 0.0549 for t32).
experiment: connor
architecture: jumprelu
game: quarto
hook: fc1
data: data/quarto/fc1_amalgam_activations.pt

expansion: 8
batch_size: 4096
num_batches: 5000
lr: 3e-4
seed: 42
log_every: 100

jump_threshold: 0.001
l0_target: 16
label: "jumprelu t=16"
