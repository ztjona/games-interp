# Follow-up: rerun missing conv2 BatchTopK checkpoint on a faster GPU
experiment: B01-conv2-completion-s42
architecture: batchtopk
game: quarto
hook: conv2
data: data/quarto/conv2_512_amalgam_activations.pt
expansion: 4
batch_size: 4096
num_batches: 25000
lr: 0.0003
seed: 42
log_every: 500
k: 64

