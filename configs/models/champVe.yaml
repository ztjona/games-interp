# Quarto champion: Ve_oracleAblation(4) DISABLE_NEVER 10k.
# Same architecture as champS4 / champTa (QuartoCNNAutoregUnifiedS4, fc1=512);
# training procedure is minimax-oracle SELECT distillation (depth=2) with the
# oracle never disabled (DISABLE_NEVER) and trained for 10,000 epochs.
# Series-V is the oracle-ablation family of Ta_minimaxSelect: Ta only used the
# oracle for SELECT during training and would otherwise revert to MC targets;
# Ve keeps the oracle on indefinitely and trains 2.3x longer.
#
# Benchmark (2026-05-24, hierarchical-SAE/champion-results.jsonl, 500 matches each):
#   vs Random Baseline           94.3%
#   vs Loss_BT                   88.3%
#   vs Aa_replay(2)              80.9%
#   vs ME_endgame(2)             72.9%
#   vs Sa_archScan(3) [S4]       73.7%
#   vs Ta_minimaxSelect(1) [Ta]  59.4%   <- previous champion
name: champVe
display_name: "Ve_oracleAblation(4) [DISABLE_NEVER, E=10000]"
game: quarto_s4
