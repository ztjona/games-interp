# E04: conv2 topk k=96, exp=8. Upper end of the k-sweep.
experiment: E04-champS4-s42
architecture: topk
game: quarto
hook: s4.conv2
data: data/quarto/s4.conv2_amalgam_s4_activations.pt
expansion: 8
batch_size: 4096
num_batches: 25000
lr: 0.0003
seed: 42
log_every: 500
k: 96
aux_loss_weight: 0.01
patience: 20
