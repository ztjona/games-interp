# C01-champTa: conv2 topk k=16 exp=8. Direct re-run of the collapsed C01 setting
# on the new champion. On champS4 this collapsed (cov>50 fell 0.40 -> 0.04).
# Tests whether the same k=16 floor exists when activations come from the
# minimax-trained model. Reference point for the E-series k-curve.
experiment: C01-champTa-s42
architecture: topk
game: quarto
hook: s4.conv2
data: data/quarto/s4.conv2_amalgam_ta_activations.pt
expansion: 8
batch_size: 4096
num_batches: 25000
lr: 0.0003
seed: 42
log_every: 500
k: 16
aux_loss_weight: 0.01
patience: 20
min_improvement: 0.02

# --- Recipe conformance stamp (added 2026-08-15) ---
# This run was trained BEFORE the canonical-form fix, so its deviations are
# pinned explicitly here. Defaults are now the published form; without these
# lines a rerun would train a different (canonical) SAE under the same name.
# See docs/diary/2026-08-15_dead-feature-revival.md
init_mode: kaiming            # legacy: W_enc drawn independently
