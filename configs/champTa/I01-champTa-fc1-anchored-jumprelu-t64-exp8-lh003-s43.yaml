# I01-champTa: anchored-jumprelu, t=64, exp=8, λ_high=0.03, λ_medium=0.01.
# Anchors first 36 dictionary slots to tigerTa BSPs via BCE-with-logits on the
# encoder pre-activation. High-tier categories (3): ['tiger_square_winnable', 'tiger_offered_completing_attr', 'tiger_line_winnable'].
# Built on F04 jumprelu (champTa fc1 winner) as the base architecture; the
# I-series sweeps λ_high ∈ {0.03, 0.10, 0.30, 1.0} × 3 seeds.
experiment: I01-champTa-lh003-s43
architecture: anchored-jumprelu
game: quarto
hook: s4.fc1
data: data/quarto/s4.fc1_amalgam_ta_activations.pt
expansion: 8
batch_size: 4096
num_batches: 25000
lr: 0.0003
seed: 43
log_every: 500
jump_threshold: 0.001
l0_target: 64
patience: 0
min_improvement: 0.001
l0_patience: 0
l0_min_change: 5.0
# Anchor configuration
anchor_bsps: data/quarto/bsp_labels-tigerTa_36.pt
anchor_schema: data/quarto/bsp_schema-tiger_36.json
anchor_index_mode: prefix
anchor_loss: bce
anchor_lambda_high: 0.03
anchor_lambda_medium: 0.01
anchor_high_categories:
  - tiger_square_winnable
  - tiger_offered_completing_attr
  - tiger_line_winnable
