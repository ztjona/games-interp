# F00-champVe: fc1 batchtopk k=16 exp=8.
# Equivalent to A01v2-champS4 (i.e. A01 with the exp fix). The A01 ID is
# preserved for champS4 only because it carries history of the original
# A01@exp=2 mistake. champVe starts with the correct exp=8 from the start,
# so it uses a fresh "F00" slot in the fc1 F-series.
experiment: F00-champVe-s42
architecture: batchtopk
game: quarto
hook: s4.fc1
data: data/quarto/s4.fc1_amalgam_ve_activations.pt
expansion: 8
batch_size: 4096
num_batches: 25000
lr: 0.0003
seed: 42
log_every: 500
k: 16

# --- Recipe conformance stamp (added 2026-08-15) ---
# This run was trained BEFORE the canonical-form fix, so its deviations are
# pinned explicitly here. Defaults are now the published form; without these
# lines a rerun would train a different (canonical) SAE under the same name.
# See docs/diary/2026-08-15_dead-feature-revival.md
init_mode: kaiming            # legacy: W_enc drawn independently
aux_loss_weight: 0.0        # legacy: no dead-feature revival
